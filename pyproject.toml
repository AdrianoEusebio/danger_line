[project]
name = "danger-line"
version = "2.0.0"
description = "Sistema administrativo e assistente com IA base para buscas e resumos — otimizador de tokens para IAs premium"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }
authors = [{ name = "Adrian" }]

dependencies = [
    # MCP Server
    "mcp[cli]>=1.0.0",

    # CLI
    "rich>=13.0.0",
    "click>=8.1.0",

    # Providers de IA
    "groq>=0.9.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.3.0",

    # Configuração
    "python-dotenv>=1.0.0",

    # HTTP (retry logic)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
danger-line = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.hatch.build.targets.wheel]
packages = ["src"]
